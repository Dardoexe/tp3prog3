<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - React</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
    <nav class="menu">
        <a href="index.html">INICIO</a>
        <a href="flexbox.html">FLEXBOX</a>
        <a href="personas.html">PERSONAS</a>
        <a href="react.html">REACT</a>
    </nav>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [personas, setPersonas] = useState([]);
            const [form, setForm] = useState({ nombre: '', apellido: '', edad: '', altura: '', peso: '' });

            const handleChange = (e) => {
                 setForm({ ...form, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const alt = parseFloat(form.altura);
                const pes = parseFloat(form.peso);
                const imcCalculado = (pes / (alt * alt)).toFixed(2);

                const nuevaPersona = {
                    id: Date.now(),
                    ...form,
                    imc: imcCalculado
                };

                setPersonas([...personas, nuevaPersona]);
                setForm({ nombre: '', apellido: '', edad: '', altura: '', peso: '' }); // Reset
            };

            const eliminarPersona = (id) => {
                setPersonas(personas.filter(p => p.id !== id));
            };

            return (
                <div>
                    <h2>Registro de Personas</h2>
                    <form onSubmit={handleSubmit}>
                        <input name="nombre" value={form.nombre} onChange={handleChange} placeholder="Nombre" required />
                        <input name="apellido" value={form.apellido} onChange={handleChange} placeholder="Apellido" required />
                        <input name="edad" type="number" value={form.edad} onChange={handleChange} placeholder="Edad" required />
                        <input name="altura" type="number" step="0.01" value={form.altura} onChange={handleChange} placeholder="Altura (metros)" required />
                        <input name="peso" type="number" step="0.1" value={form.peso} onChange={handleChange} placeholder="Peso (kilogramos)" required />
                        <button type="submit">Agregar</button>
                    </form>

                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th><th>Apellido</th><th>Edad</th><th>Altura</th><th>Peso</th><th>IMC</th><th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            {personas.map(p => (
                                <tr key={p.id}>
                                    <td>{p.nombre}</td>
                                    <td>{p.apellido}</td>
                                    <td>{p.edad}</td>
                                    <td>{p.altura}m</td>
                                    <td>{p.peso}kg</td>
                                    <td><strong>{p.imc}</strong></td>
                                    <td><button onClick={() => eliminarPersona(p.id)}>Eliminar</button></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
