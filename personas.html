<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Personas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="menu">
        <a href="index.html">INICIO</a>
        <a href="flexbox.html">FLEXBOX</a>
        <a href="personas.html">PERSONAS</a>
        <a href="react.html">REACT</a>
    </nav>

    <h2>Formulario y Tabla de Personas</h2>

    <form id="formulario-persona">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>
        <input type="number" id="edad" placeholder="Edad" required>
        <input type="number" step="0.01" id="altura" placeholder="Altura (en metros)" required>
        <input type="number" step="0.1" id="peso" placeholder="Peso (en kilogramos)" required>
        <button type="submit">Agregar Persona</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Altura</th>
                <th>Peso</th>
                <th>IMC</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo">
            </tbody>
    </table>

    <script src="personas.js"></script>
</body>
</html>
